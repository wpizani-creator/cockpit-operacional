<!-- ========================================================================================= -->
<!-- ARQUIVO: frontend/views/Configuracoes/setups.html                                         -->
<!-- CONTEXTO: Gestão de Parâmetros e Setups (Persistência Instantânea)                        -->
<!-- ========================================================================================= -->
<div class="w-full px-6 py-4 space-y-6 max-w-none">
    <!-- Cabeçalho da Seção -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <div class="flex items-center gap-2.5 mb-1">
                <div class="bg-cyan-600/20 text-cyan-400 p-2 rounded-lg border border-cyan-500/30">
                    <i class="fa-solid fa-sliders text-base"></i>
                </div>
                <h1 class="text-lg font-bold text-white tracking-wide">Parâmetros & Setups Operacionais</h1>
                <span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2.5 py-0.5 rounded font-mono">setups.html</span>
            </div>
            <p class="text-xs text-gray-400">Cadastre e gerencie as opções que alimentarão os seletores dinâmicos no gerenciamento de trades (Servidor SQLite).</p>
        </div>
        <div class="flex items-center gap-3">
            <select id="selectCategoriaPainel" onchange="window.carregarParametrosCategoria()" class="bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2 text-xs text-gray-200 outline-none focus:border-cyan-500 font-mono">
                <option value="setups">SETUPS</option>
                <option value="complementos">COMPLEMENTOS</option>
                <option value="timeframes">TIMEFRAMES</option>
                <option value="entradas">ENTRADAS</option>
                <option value="saidas">SAÍDAS</option>
                <option value="checklist">CHECKLIST</option>
                <option value="falhas">FALHAS</option>
                <option value="emocional">EMOCIONAL</option>
                <option value="cesta_ativos">CESTA DE ATIVOS</option>
                <option value="opcao1">OPÇÃO 1</option>
                <option value="opcao2">OPÇÃO 2</option>
                <option value="opcao3">OPÇÃO 3</option>
            </select>
            <button onclick="window.adicionarNovoParametroLinha()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-plus"></i> Adicionar Item
            </button>
        </div>
    </div>

    <!-- Tabela Dinâmica -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg w-full">
        <div class="w-full overflow-x-auto">
            <table class="w-full text-left text-xs table-auto border-collapse">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-800 bg-gray-950/40">
                        <th class="py-3 px-4 font-medium w-16">#</th>
                        <th class="py-3 px-4 font-medium w-1/3">NOME DO PARÂMETRO / ITEM</th>
                        <th class="py-3 px-4 font-medium w-7/12">DESCRIÇÃO / REGRA / POSSIBILIDADES</th>
                        <th class="py-3 px-4 font-medium text-right w-24">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabelaParametrosCorpo" class="divide-y divide-gray-800 text-gray-300">
                    <!-- Preenchido dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        function normalizarItens(bruto) {
            if (!Array.isArray(bruto)) return [];
            return bruto.map(item => {
                if (typeof item === 'object' && item !== null) {
                    return { 
                        nome: item.nome || item.titulo || item.item || '', 
                        descricao: item.descricao || item.regra || item.possibilidades || '' 
                    };
                }
                return { nome: String(item), descricao: '' };
            });
        }

        window.obterCategoriaAtual = function() {
            const select = document.getElementById('selectCategoriaPainel');
            return select ? select.value : 'setups';
        };

        window.carregarParametrosCategoria = async function() {
            const cat = window.obterCategoriaAtual();
            let itens = [];

            try {
                const response = await fetch(`/api/parametros?categoria=${cat}`, { credentials: 'same-origin' });
                if (response.ok) {
                    const dadosServidor = await response.json();
                    if (Array.isArray(dadosServidor)) {
                        itens = normalizarItens(dadosServidor);
                    }
                }
            } catch(e) {
                console.error("Erro ao buscar parâmetros da API:", e);
            }

            window._itensCacheCategoria = itens;
            window.renderizarTabelaParametros(itens);
        };

        window.renderizarTabelaParametros = function(itens) {
            const tbody = document.getElementById('tabelaParametrosCorpo');
            if (!tbody) return;

            tbody.innerHTML = '';

            if (!Array.isArray(itens) || itens.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="py-8 text-center text-gray-500 italic">
                            Nenhum item cadastrado para esta categoria. Clique em "+ Adicionar Item" para começar.
                        </td>
                    </tr>
                `;
                return;
            }

            itens.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-950/30 transition';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-gray-500 align-middle">#${index + 1}</td>
                    <td class="py-3 px-4 align-middle">
                        <input type="text" value="${item.nome || ''}" oninput="window.atualizarItemParametroEmMemoria(${index}, 'nome', this.value)" onblur="window.salvarEstadoAtualServidor()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2 text-xs text-white outline-none focus:border-cyan-500 font-mono shadow-inner">
                    </td>
                    <td class="py-3 px-4 align-middle">
                        <input type="text" value="${item.descricao || ''}" oninput="window.atualizarItemParametroEmMemoria(${index}, 'descricao', this.value)" onblur="window.salvarEstadoAtualServidor()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2 text-xs text-gray-200 outline-none focus:border-cyan-500 shadow-inner">
                    </td>
                    <td class="py-3 px-4 text-right align-middle">
                        <button onclick="window.removerItemParametro(${index})" class="text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-950 border border-red-900/50 px-2.5 py-1.5 rounded-lg transition text-[11px]">
                            <i class="fa-solid fa-trash-can mr-1"></i> Excluir
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.atualizarItemParametroEmMemoria = function(index, campo, valor) {
            if (!window._itensCacheCategoria) window._itensCacheCategoria = [];
            if (window._itensCacheCategoria[index]) {
                window._itensCacheCategoria[index][campo] = valor;
            }
        };

        window.salvarEstadoAtualServidor = async function() {
            const cat = window.obterCategoriaAtual();
            const itensNormalizados = normalizarItens(window._itensCacheCategoria);
            try {
                await fetch(`/api/parametros?categoria=${cat}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(itensNormalizados)
                });
            } catch(e) {
                console.error("Erro ao salvar parâmetros no servidor:", e);
            }
        };

        window.adicionarNovoParametroLinha = async function() {
            if (!window._itensCacheCategoria) window._itensCacheCategoria = [];
            window._itensCacheCategoria.push({ nome: 'NOVO ITEM', descricao: 'Descreva aqui...' });
            window.renderizarTabelaParametros(window._itensCacheCategoria);
            await window.salvarEstadoAtualServidor();
        };

        window.removerItemParametro = async function(index) {
            if (!window._itensCacheCategoria) window._itensCacheCategoria = [];
            window._itensCacheCategoria.splice(index, 1);
            window.renderizarTabelaParametros(window._itensCacheCategoria);
            await window.salvarEstadoAtualServidor();
        };

        (function init() {
            window.carregarParametrosCategoria();
        })();
    })();
</script>
