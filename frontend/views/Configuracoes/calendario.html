<!-- ========================================================================================= -->
<!-- ARQUIVO: frontend/views/Configuracoes/calendario.html                                     -->
<!-- CONTEXTO: Calendário Operacional - Migrado para SQLite / FastAPI com Zero Perda           -->
<!-- ========================================================================================= -->
<div class="max-w-[96%] mx-auto space-y-4 pb-10 h-[calc(100vh-120px)] flex flex-col">
    
    <!-- Cabeçalho Fixo do Módulo -->
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shrink-0 z-20">
        <div>
            <div class="flex items-center gap-2.5">
                <span class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 p-2 rounded-lg text-sm">
                    <i class="fa-solid fa-calendar-days"></i>
                </span>
                <h1 class="text-base font-bold text-white tracking-wide">Calendário Operacional & Gestão de Feriados/Folgas</h1>
                <span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded font-mono">calendario.html</span>
            </div>
            <p class="text-xs text-gray-400 mt-1">Clique em qualquer dia para alternar o status (Útil ➔ Folga 'D' ➔ Férias 'F') [Servidor SQLite].</p>
        </div>

        <div class="flex items-center gap-3">
            <select id="anoSelecionado" class="bg-gray-950 border border-gray-800 text-xs text-white rounded-lg px-3 py-2 outline-none focus:border-indigo-500 font-mono">
                <option value="2026" selected>Ano 2026</option>
                <option value="2027">Ano 2027</option>
            </select>
            <button id="btnSalvarCalendario" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition shadow">
                <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
            </button>
        </div>
    </div>

    <!-- Legenda Fixa -->
    <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl shadow-md flex flex-wrap items-center justify-between gap-3 text-xs shrink-0 z-20">
        <div class="flex items-center gap-4 flex-wrap">
            <span class="text-gray-400 font-semibold uppercase tracking-wider text-[10px]">Legenda:</span>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-gray-950 border border-gray-700 inline-block"></span> <span class="text-gray-300">Dia Útil</span></div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-950/80 border border-amber-700/80 inline-block"></span> <span class="text-amber-300">Feriado</span></div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-blue-950/80 border border-blue-700/80 inline-block"></span> <span class="text-blue-300">Folga [D]</span></div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-purple-950/80 border border-purple-700/80 inline-block"></span> <span class="text-purple-300">Férias [F]</span></div>
        </div>
        <div class="text-[11px] text-gray-400 bg-gray-950 px-3 py-1.5 rounded border border-gray-800">
            💡 <span class="text-indigo-400 font-semibold">Dica:</span> Clique direto no dia para alternar os estados.
        </div>
    </div>

    <!-- Container com Barra de Rolagem para os Meses -->
    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
        <div id="gridMeses" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-5">
            <!-- Preenchido dinamicamente via JS -->
        </div>
    </div>
</div>

<style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #030712; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
</style>

<script>
    (function() {
        let dadosCalendario = {};

        async function carregarDadosServidor() {
            try {
                const resp = await fetch('/api/calendario', { credentials: 'same-origin' });
                if (resp.ok) {
                    const dados = await resp.json();
                    if (dados && typeof dados === 'object') {
                        dadosCalendario = dados;
                        return;
                    }
                }
            } catch(e) {}

            // Migração de Fallback do localStorage se necessário
            try {
                const localStr = localStorage.getItem('cockpit_calendario_customizacoes_v10');
                if (localStr) {
                    const dadosLocais = JSON.parse(localStr);
                    if (dadosLocais && typeof dadosLocais === 'object' && Object.keys(dadosLocais).length > 0) {
                        dadosCalendario = dadosLocais;
                        await salvarDadosServidor(false);
                        localStorage.removeItem('cockpit_calendario_customizacoes_v10');
                        return;
                    }
                }
            } catch(e) {}

            dadosCalendario = {};
        }

        async function salvarDadosServidor(mostrarAlerta = true) {
            try {
                await fetch('/api/calendario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(dadosCalendario)
                });
                if (mostrarAlerta) {
                    alert('Calendário operacional guardado com sucesso no servidor SQLite!');
                }
            } catch(e) {
                console.error("Erro ao salvar calendário no servidor:", e);
                if (mostrarAlerta) alert('Erro ao comunicar com o servidor FastAPI.');
            }
        }

        function calcularFeriadosNacionais(ano) {
            let feriados = {};
            feriados[`${ano}-01-01`] = 'Confraternização Universal';
            feriados[`${ano}-04-21`] = 'Tiradentes';
            feriados[`${ano}-05-01`] = 'Dia do Trabalho';
            feriados[`${ano}-09-07`] = 'Independência do Brasil';
            feriados[`${ano}-10-12`] = 'Nossa Sra. Aparecida';
            feriados[`${ano}-11-02`] = 'Finados';
            feriados[`${ano}-11-15`] = 'Proclamação da República';
            feriados[`${ano}-11-20`] = 'Dia da Consciência Negra';
            feriados[`${ano}-12-25`] = 'Natal';

            const a = ano % 19;
            const b = Math.floor(ano / 100);
            const c = ano % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const L = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * L) / 451);
            const mesPascoa = Math.floor((h + L - 7 * m + 114) / 31);
            const diaPascoa = ((h + L - 7 * m + 114) % 31) + 1;
            
            let pascoa = new Date(ano, mesPascoa - 1, diaPascoa);

            function fmt(dObj) {
                let mStr = (dObj.getMonth() + 1).toString().padStart(2, '0');
                let dtStr = dObj.getDate().toString().padStart(2, '0');
                return `${dObj.getFullYear()}-${mStr}-${dtStr}`;
            }

            let sextaSanta = new Date(pascoa);
            sextaSanta.setDate(pascoa.getDate() - 2);
            feriados[fmt(sextaSanta)] = 'Sexta-feira Santa';

            let carnaval = new Date(pascoa);
            carnaval.setDate(pascoa.getDate() - 47);
            feriados[fmt(carnaval)] = 'Carnaval';

            let corpusChristi = new Date(pascoa);
            corpusChristi.setDate(pascoa.getDate() + 60);
            feriados[fmt(corpusChristi)] = 'Corpus Christi';

            return feriados;
        }

        async function renderizar() {
            await carregarDadosServidor();
            const anoSelect = document.getElementById('anoSelecionado');
            if (!anoSelect) return;
            const ano = parseInt(anoSelect.value) || 2026;
            const container = document.getElementById('gridMeses');
            if (!container) return;

            const feriados = calcularFeriadosNacionais(ano);
            const nomesMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            let htmlGeral = '';

            for (let m = 0; m < 12; m++) {
                let primeiroDia = new Date(ano, m, 1).getDay();
                let ultimoDia = new Date(ano, m + 1, 0).getDate();

                htmlGeral += `
                    <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 shadow-lg space-y-3">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                                <i class="fa-solid fa-calendar text-indigo-400"></i> ${nomesMeses[m]} / ${ano}
                            </h3>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-mono text-gray-500 font-semibold">
                            ${diasSemana.map(d => `<div>${d}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-1">
                `;

                for (let i = 0; i < primeiroDia; i++) {
                    htmlGeral += `<div class="h-9"></div>`;
                }

                for (let d = 1; d <= ultimoDia; d++) {
                    let mesStr = (m + 1).toString().padStart(2, '0');
                    let diaStr = d.toString().padStart(2, '0');
                    let dataChave = `${ano}-${mesStr}-${diaStr}`;
                    
                    let dataObj = new Date(ano, m, d);
                    let diaSemana = dataObj.getDay();
                    let ehFimDeSemana = (diaSemana === 0 || diaSemana === 6);
                    let nomeFeriado = feriados[dataChave];
                    let statusCustom = dadosCalendario[dataChave];

                    let classesTailwind = "day-cell h-9 flex items-center justify-center rounded border text-xs font-mono transition select-none cursor-pointer bg-gray-900 border-gray-800 text-gray-300 hover:border-indigo-500";
                    let textoExibicao = d;
                    let statusAtributo = "util";

                    if (ehFimDeSemana) {
                        classesTailwind = "day-cell h-9 flex items-center justify-center rounded border text-xs font-mono transition select-none cursor-pointer bg-gray-900/30 border-gray-800/40 text-gray-600";
                    } else if (nomeFeriado) {
                        classesTailwind = "day-cell h-9 flex items-center justify-center rounded border text-xs font-mono transition select-none cursor-pointer bg-amber-950/60 border-amber-700/70 text-amber-300 font-bold";
                    }

                    if (statusCustom === 'folga') {
                        classesTailwind = "day-cell h-9 flex items-center justify-center rounded border text-xs font-mono transition select-none cursor-pointer bg-blue-950/70 border-blue-600 text-blue-300 font-bold";
                        statusAtributo = "folga";
                        textoExibicao = `${d} D`;
                    } else if (statusCustom === 'ferias') {
                        classesTailwind = "day-cell h-9 flex items-center justify-center rounded border text-xs font-mono transition select-none cursor-pointer bg-purple-950/70 border-purple-600 text-purple-300 font-bold";
                        statusAtributo = "ferias";
                        textoExibicao = `${d} F`;
                    }

                    htmlGeral += `
                        <div class="${classesTailwind}" data-date="${dataChave}" data-status="${statusAtributo}">
                            <span>${textoExibicao}</span>
                        </div>
                    `;
                }

                htmlGeral += `</div></div>`;
            }

            container.innerHTML = htmlGeral;
        }

        document.addEventListener('click', async function(event) {
            const dayElement = event.target.closest('.day-cell');
            if (!dayElement) return;

            const dataStr = dayElement.getAttribute('data-date');
            if (!dataStr) return;

            let currentStatus = dayElement.getAttribute('data-status') || 'util';

            if (currentStatus === 'util') {
                dadosCalendario[dataStr] = 'folga';
            } else if (currentStatus === 'folga') {
                dadosCalendario[dataStr] = 'ferias';
            } else {
                delete dadosCalendario[dataStr];
            }

            await salvarDadosServidor(false);
            renderizar();
        });

        const selectAno = document.getElementById('anoSelecionado');
        if (selectAno) {
            selectAno.addEventListener('change', renderizar);
        }

        const btnSalvar = document.getElementById('btnSalvarCalendario');
        if (btnSalvar) {
            btnSalvar.addEventListener('click', () => salvarDadosServidor(true));
        }

        setTimeout(renderizar, 50);
    })();
</script>
